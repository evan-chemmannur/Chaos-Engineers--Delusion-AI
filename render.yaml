services:
  - type: web
    name: ishtaai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir app server:app --bind 0.0.0.0:$PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: SAVE_AI_HISTORY
        value: "true"
      - key: THEME_MODE
        value: dark
